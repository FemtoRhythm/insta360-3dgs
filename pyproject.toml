[project]
name = "insta360-3dgs"
version = "0.1.0"
description = "Insta360 .insv -> 全景 3D Gaussian Splatting 点云流水线 (MediaSDK 拼接 + 等矩形 SfM + 3DGS)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "FemtoRhythm" }]
keywords = ["insta360", "3dgs", "gaussian-splatting", "colmap", "panorama", "point-cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "plyfile>=0.8",
    "tqdm>=4.64",
]

[project.urls]
Homepage = "https://github.com/FemtoRhythm/insta360-3dgs"
Repository = "https://github.com/FemtoRhythm/insta360-3dgs"

[project.scripts]
insta360-3dgs = "insta360_3dgs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta360_3dgs"]

# 说明: torch(CUDA) / pycolmap / 已编译的 diff-gaussian-rasterization、simple-knn
# 属于"重型运行时依赖", 默认复用已有的已编译环境 (见 config.py 与 README)。
# 如需在 uv 环境内自行安装 torch(CUDA), 取消下面注释并按需选择 CUDA 索引:
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu128" }
#
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true
